[package]
name = "sync_clipboard_desktop"
version = "0.1.0"
description = "Clipboard Bridge desktop app"
authors = ["Sync Clipboard"]
edition = "2021"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
arboard = "3"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
hex = "0.4"
