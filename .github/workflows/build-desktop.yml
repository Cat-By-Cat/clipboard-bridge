name: Build Desktop Apps

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: sync-clipboard-windows
            bundle-target: msi
          - platform: macos-13
            artifact-name: sync-clipboard-macos
            bundle-target: dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Tauri bundler tools
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/target/.tauri
          key: ${{ runner.os }}-tauri-bundler-tools-v1

      - name: Install Windows bundler tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress

          $wixBin = @(
            $env:WIX | ForEach-Object { if ($_ ) { Join-Path $_ 'bin' } }
            Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'bin' }
          ) | Where-Object { $_ -and (Test-Path (Join-Path $_ 'candle.exe')) } | Select-Object -First 1

          if (-not $wixBin) {
            throw 'WiX Toolset was installed but candle.exe could not be found.'
          }

          Add-Content -Path $env:GITHUB_ENV -Value "WIX=$($wixBin | Split-Path -Parent)"
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set replace-registry-host always
          npm cache verify

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            if npm ci --include=optional --registry=https://registry.npmjs.org/ --replace-registry-host=always; then
              break
            else
              status=$?
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              exit "$status"
            fi

            npm cache clean --force
            sleep $((10 * attempt))
          done

          npm exec --workspace desktop -- tsc --version
          npm exec --workspace desktop -- vite --version

      - name: Build Windows Tauri MSI
        if: runner.os == 'Windows'
        run: npm --workspace desktop run tauri -- build --bundles ${{ matrix.bundle-target }} --ci

      - name: Build macOS Electron DMG
        if: runner.os == 'macOS'
        run: npm --workspace desktop run electron:build:mac

      - name: Collect release assets
        shell: bash
        run: |
          release_assets="$(pwd)/release-assets"
          mkdir -p "$release_assets"

          if [ -d desktop/src-tauri/target/release/bundle ]; then
            find desktop/src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -print |
              while IFS= read -r file; do
                cp "$file" "$release_assets/"
              done

            while IFS= read -r app; do
              name="$(basename "$app" .app)"
              (cd "$(dirname "$app")" && zip -qry "$release_assets/$name.app.zip" "$(basename "$app")")
            done < <(find desktop/src-tauri/target/release/bundle -type d -name '*.app')
          fi

          if [ -d desktop/dist-electron ]; then
            find desktop/dist-electron -type f -name '*.dmg' -print |
              while IFS= read -r file; do
                cp "$file" "$release_assets/"
              done
          fi

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.app
            desktop/dist-electron/**/*.dmg
          if-no-files-found: warn

      - name: Upload desktop bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: false
