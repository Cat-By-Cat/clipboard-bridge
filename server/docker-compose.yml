services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
      POSTGRES_DB: sync_clipboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync_clipboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8787
      DATABASE_URL: postgres://sync:sync@postgres:5432/sync_clipboard
      JWT_SECRET: change-me-in-production
      REFRESH_SECRET: change-me-too
      UPLOAD_DIR: /app/server/uploads
      MAX_FILE_BYTES: 1073741824
      CORS_ORIGIN: '*'
      WEB_DIST_DIR: /app/web/dist
    volumes:
      - uploads:/app/server/uploads
    ports:
      - "8787:8787"

volumes:
  pgdata:
  uploads:
